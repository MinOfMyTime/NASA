# AnalogFinder configuration. Longitudes: Mars targets are EAST-POSITIVE 0..360; Earth sites are -180..180.
year: 2023                     # full recent year for MODIS (MYD11C3 monthly, MCD43C3 daily sampled)
mcd43c3_days: [1, 16]          # day-of-month sampled for MCD43C3 (16-day moving window product -> full-year coverage)

grids:
  earth_ppd: 20                # 0.05 deg analysis grid (MODIS CMG)
  web_ppd: 4                   # 0.25 deg grid shipped to the web app
  web_lat_range: [-60, 84]     # land rows kept for the web grids

topography:
  # Matched physical scale on both planets. Pixel baseline is set by the supplied MOLA MEGDR (1/16 deg = 3.705 km).
  pixel_km: 3.705
  window_px: 5                 # relief / roughness window: 5 px = ~18.5 km
  tpi_window_px: 9             # topographic position index window (~33 km)

mars:
  window_deg: 1.0
  tes_mineral_orientation: {north_up: true, lon0: 0.0}   # verified in scripts/inspect_mars.py
  targets:
    jezero:    {name: "Jezero Crater (Perseverance)",     lat: 18.4,  lon_e360: 77.6}
    gale:      {name: "Gale Crater (Curiosity)",          lat: -5.4,  lon_e360: 137.8}
    meridiani: {name: "Meridiani Planum (Opportunity)",   lat: -1.9,  lon_e360: 354.5}

weights: {topo: 0.25, thermo: 0.25, mineral: 0.30, aridity: 0.15, extremes: 0.05}

similarity:
  sigma: 1.0                   # s = exp(-d^2 / (2 sigma^2)), d = robust distance in target-IQR units
  # Minimum robust scale per feature (prevents a near-zero target IQR from making the score a spike).
  min_scale:
    pct: 0.10                  # percentile-space features (0..1); cross-instrument percentile mapping is not finer than ~0.1
    log_relief: 0.15
    slope_deg: 0.3
    log_rough: 0.15
    tpi_m: 30.0
    albedo: 0.05                # TES bolometric vs MODIS shortwave band difference + 7.4 km TES pixels
    ndvi: 0.1
    diurnal_range_k: 10.0
    lst_min_k: 10.0
    lst_max_k: 10.0

candidates:
  top_fraction: 0.005
  min_cells: 4                 # drop speckle: regions smaller than 4 cells (~100 km2 at low latitude)
  n_candidates: 25
  exclude_known_km: 150

masks:
  ndvi_max_for_mineral: 0.3    # TIR mineral indices are only meaningful on sparsely vegetated ground
  ice_lst_max_k: 273.15        # cells whose warmest monthly daytime LST never exceeds 0 C are treated as permanent ice
  tir_contrast_min: 0.012      # ASTER TIR contrast below this = snow/frost-flattened spectrum -> no mineral score (scripts/mask_stats.py: median 0.007 at 60-70N vs 0.019-0.068 elsewhere)
  aster_nobs_min: 3            # mean ASTER observations per 1 km pixel (AG1km NumObs); fewer = unreliable emissivity
  ati:                         # monthly apparent-thermal-inertia filter (high-latitude artifact fix, see REPORT.md)
    min_dt_k: 10.0             # a month is usable only if LST_day - LST_night >= 10 K ...
    min_day_k: 273.15          # ... and LST_day is above freezing
    min_months: 4              # need >= 4 usable months, else ATI = NaN
  snow:                        # MOD10CM permanent snow/ice: every usable month >= min_frac_pct snow
    min_frac_pct: 50
    min_months: 3

known_analogs:
  atacama:       {name: "Atacama Desert",             lat: -24.5,  lon: -69.25}
  mojave:        {name: "Mojave / Death Valley",      lat: 36.5,   lon: -117.0}
  mdrs_utah:     {name: "Utah MDRS",                  lat: 38.41,  lon: -110.79}
  iceland:       {name: "Iceland highlands",          lat: 64.9,   lon: -17.5}
  mauna_kea:     {name: "Mauna Kea flanks",           lat: 19.8,   lon: -155.5}
  rio_tinto:     {name: "Rio Tinto",                  lat: 37.7,   lon: -6.6}
  haughton:      {name: "Haughton Crater",            lat: 75.4,   lon: -89.7}
  # Added in round 3 after the Gale #1 candidate (58.3N, 155.2W) was recognised as the Katmai area. Published analog:
  # Fristad, Sharpton & Eichelberger, GSA Abstracts "Katmai and the Valley of Ten Thousand Smokes as a Mars analogue";
  # NASA GSFC field campaigns 2022-2024 (Baker et al., LPSC 2023 #2837); Apollo field-geology training 1965-66.
  # Used only for the 150 km "near known analog" flag; NOT part of the validation sets (they stay frozen).
  katmai:        {name: "Katmai / Valley of Ten Thousand Smokes", lat: 58.27, lon: -155.16, exclude_only: true}

# Blind validation set: published Mars analogs NOT used while developing or tuning the method. Scored once with the
# frozen settings (src/validate.py) and reported as-is in results/validation.md.
blind_analogs:
  pilbara:        {name: "Pilbara, North Pole Dome (Dresser Fm.)", lat: -21.17, lon: 119.43,
                   ref: "Van Kranendonk et al. 2008, Precambrian Res. 167, 93 (3.48 Ga hydrothermal/biosignature analog; Mars 2020 rehearsal site)"}
  dry_valleys:    {name: "McMurdo Dry Valleys (Taylor Valley)", lat: -77.62, lon: 163.0,
                   ref: "Doran et al. 2002, JGR 107, 4772 (hyper-arid polar desert; outside the analysis latitude range -> expect n/a)"}
  lonar:          {name: "Lonar Crater", lat: 19.976, lon: 76.508,
                   ref: "Maloof et al. 2010, GSA Bull. 122, 109 (impact crater in basalt)"}
  dallol:         {name: "Dallol / Danakil", lat: 14.24, lon: 40.30,
                   ref: "Cavalazzi et al. 2019, Astrobiology 19, 553 (hydrothermal, hyper-saline, acidic)"}
  svalbard:       {name: "Svalbard, Bockfjord volcanic complex (Sverrefjell)", lat: 79.43, lon: 13.30,
                   ref: "Treiman et al. 2002, EPSL 204, 323 (carbonate-bearing volcanics, AMASE expeditions)"}
  kilbourne:      {name: "Kilbourne Hole maar", lat: 31.97, lon: -106.97,
                   ref: "Hoffer 1976, NM Bur. Mines Circ. 149 (maar crater; NASA Desert RATS / astronaut geology training)"}
